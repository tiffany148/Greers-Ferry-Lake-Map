name: Update burn bans
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: burnbans
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape burn bans
        run: python tools/scrape_burnbans.py /tmp/new.json
      - name: Commit if changed
        run: |
          changed=$(python -c "
          import json
          a=json.load(open('burnbans.json')); b=json.load(open('/tmp/new.json'))
          k=lambda d:(d.get('as_of'),sorted(d.get('counties_under_ban',[])))
          print('yes' if k(a)!=k(b) else 'no')
          ")
          echo "changed=$changed"
          if [ "$changed" = yes ]; then
            cp /tmp/new.json burnbans.json
            git config user.name "github-actions[bot]"
            git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
            git add burnbans.json
            git commit -m "Update burn bans"
            git push
          fi
